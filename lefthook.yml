pre-commit:
  parallel: true
  commands:
    rubocop:
      glob: "*.rb"
      run: bundle exec rubocop {staged_files}
      stage_fixed: true

pre-push:
  parallel: true
  commands:
    brakeman:
      run: bundle exec brakeman --no-pager -q
    bundle-audit:
      run: bundle exec bundle-audit check
