default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
      recurring_tasks:
        verify_domains:
          class: VerifyDomainsJob
          schedule: every 1 minute
        enqueue_newsletters:
          class: EnqueueNewslettersJob
          schedule: '0 0 8 * * * America/New_York'
        enqueue_u_k_newsletters:
          class: EnqueueUKNewslettersJob
          schedule: '0 0 3 * * * America/New_York'
        visits_in_last_day:
          class: VisitsInLastDayJob
          schedule: "0 8 * * * America/Los_Angeles"
        cleanup_tracking_data:
          class: CleanupTrackingDataJob
          schedule: '0 0 4 * * * America/New_York'
  workers:
    - queues: "*"
      threads: 1
      processes: 2
      polling_interval: 1

development:
 <<: *default

test:
 <<: *default

production:
 <<: *default
