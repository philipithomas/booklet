databases:
  - name: bklt-db
    databaseName: bklt_production
    user: bklt
    plan: basic-256mb

services:
  - type: web
    name: bklt
    env: ruby
    plan: standard
    buildCommand: "bundle install && yarn install && bundle exec rails assets:precompile && bundle exec rails db:migrate"
    startCommand: "bundle exec puma -C config/puma.rb"
    numInstances: 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bklt-db
          property: connectionString
      - key: RAILS_ENV
        value: production
      - key: RAILS_SERVE_STATIC_FILES
        value: "true"
      - key: RAILS_LOG_TO_STDOUT
        value: "true"
      - key: APP_MODE
        value: SOLO
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: BASE_HOST
        sync: false
      - key: POSTMARK_API_TOKEN
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: SUPPORT_EMAIL
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        sync: false
      - key: AWS_STORAGE_BUCKET
        sync: false
      - key: ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY
        generateValue: true
      - key: ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY
        generateValue: true
      - key: ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT
        generateValue: true
